<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>MY Media Hub</title>
</head>

<body>
    <!-- youtube video -->
    <h1>My Media Hub</h1>
    <h2>YouTube Video</h2>
    <iframe src="https://www.youtube.com/embed/kkOuRJ69BRY?si=Q8nx2kr1E1f-MHjB" title="YouTube video player"
        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture;
       web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen alt="html,css video" width="350"
        height="200"></iframe>

    <h2> local video</h2>
    <video controls height="250" width="300">
        <source src="video/video.mp4" type="video/mp4">

    </video>

    <h2>Audio</h2>
    <audio src="audio/Audio.mp3" alt="audio" controls></audio>

    <!-- Google Map -->
    <h2>PCPS College Location</h2>
    <iframe src="https://www.google.com/maps?q=PCPS+College+Kupondole+Lalitpur&output=embed" width="300" height="200"
        style="border:0;" loading="lazy">
    </iframe>

    <!-- External Website -->
    <h2>External Website</h2>
    <iframe src="https://w3schools.com/" width="400" height="200" title="W3Schools Website">
        </iframe>

    <!-- PDF -->
    <h2>My PDF Document</h2>
    <embed src="files/Assignment 1 FSC.PDF" type="application/pdf" width="500" height="300">



</body>

</html>
