
<!DOCTYPE html>
<html>

<head>
    <title>Nanita Bhujel - Contact</title>
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Feel free to send me a message.</p>
    </header>

    <!-- Shared Navigation Bar -->
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>

            <h2>Contact Form</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text"
                       id="name"
                       name="name">
                <br><br>

                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email">
                <br><br>

                <label for="subject">Subject:</label>
                <input type="text"
                       id="subject"
                       name="subject">
                <br><br>

                <label for="message">Message:</label>
                <br>

                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40"></textarea>

                <br><br>

                <input type="submit"
                       value="Send Message">

            </form>

        </section>

        <section>
            <h2>My Favorite Website</h2>

            <p>
                <a href="https://github.com"
                   target="_blank">
                    Visit my favorite website
                </a>
            </p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Nanita Bhujel</p>
    </footer>

</body>

</html>
