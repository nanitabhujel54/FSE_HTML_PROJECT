<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>
</head>
<style>
    table {
     border-collapse:collapse ;
    }

    th,tr,td {
        border:1px solid black;
        padding:8px;
    }
</style>
<body>
    <h1>Class Timetable</h1>
    <table>
        <tr>
            <th>Time/Days</th>
            <th>Sunday</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wedensday</th>
            <th>Thursday</th>
            <th>Friday</th>
           
        </tr>

        <tr>
            <td>7 AM - 9 AM</td>
            <td>MCCT</td>
            <td>FSE</td>
            <td>FSE</td>
            <td>MCCT</td>
            <td>FSE</td>
            <td rowspan="5"> Holiday</td>
        
        </tr>

        <tr>
            <td>9 AM - 10 AM</td>
            <td colspan="6">Lunch Break</td>
        </tr>

        <tr>
            <td>10 AM - 12 PM</td>
            <td>FSE</td>
            <td>MCCT</td>
            <td>FSE</td>
            <td>FSC</td>
            <td>MCCT</td>
        </tr>

        <tr>
            <td>12 PM - 1 PM</td>
            <td colspan="6">Lunch Break</td>
        </tr>

        <tr>
            <td>1 PM - 3 PM</td>
            <td>  </td>
            <td>MCCT</td>
            <td>MCCT</td>
            <td></td>
            <td>FSE</td>
        </tr>
        
    </table>
    
</body>
</html>
